name: Publish notes

# Validate notes, merge notes-only pull requests automatically, and publish.
#
#   push to main         -> validate -> publish
#   pull request         -> validate -> auto-merge (notes-only PRs) -> publish
#
# Publishing copies notes/ and practice/ into the website repository, builds
# the site, and pushes only if the build passes; Cloudflare Pages then
# deploys the website.
#
# Auto-merge only happens for pull requests that come from this repository
# (never from forks), are opened by the repository owner, are not drafts,
# and change nothing but notes content. Anything touching workflows or
# scripts waits for a manual merge.
#
# A merge made with GITHUB_TOKEN does not start a new push run, so the same
# run publishes right after it merges.
#
# Needs one secret, WEBSITE_REPO_TOKEN: a fine-grained personal access token
# with "Contents: Read and write" on SinghChinmayy/SinghChinmayy only.
# Without it, notes are still validated and merged; publishing is skipped
# with a warning.

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "practice/**"
      - "scripts/check_notes.py"
      - ".github/workflows/publish.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "notes/**"
      - "practice/**"
      - "scripts/check_notes.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-notes
  cancel-in-progress: false

jobs:
  validate:
    name: Validate notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_notes.py

  automerge:
    name: Auto-merge notes
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check the pull request only changes notes
        id: scope
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "Changed files:"; echo "$files"
          outside=$(echo "$files" | grep -vE '^(notes/|practice/|log\.md$|README\.md$)' || true)
          if [ -n "$outside" ]; then
            echo "::notice::Not auto-merging: this pull request changes files outside the notes: $(echo $outside)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.scope.outputs.ok == 'true'
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to the website
    needs: [validate, automerge]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      (github.event_name != 'pull_request' || needs.automerge.outputs.merged == 'true')
    runs-on: ubuntu-latest
    env:
      WEBSITE_REPO: SinghChinmayy/SinghChinmayy
      CONTENT_DIR: src/content/engineering-notes
    steps:
      - name: Check the website token
        id: token
        env:
          TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::WEBSITE_REPO_TOKEN is not set, so the notes were validated but not published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Always publish what is on main now, including a merge made above.
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: main
          path: notes-repo

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.WEBSITE_REPO }}
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Copy notes into the website
        if: steps.token.outputs.ok == 'true'
        run: |
          rm -rf "website/$CONTENT_DIR"
          mkdir -p "website/$CONTENT_DIR"
          cp -R notes-repo/notes "website/$CONTENT_DIR/notes"
          cp -R notes-repo/practice "website/$CONTENT_DIR/practice"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the website with the new notes
        if: steps.token.outputs.ok == 'true'
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Commit and push
        if: steps.token.outputs.ok == 'true'
        working-directory: website
        run: |
          git add "$CONTENT_DIR"
          if git diff --cached --quiet; then
            echo "The website already has these notes."
            exit 0
          fi
          notes_sha=$(git -C ../notes-repo rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync engineering notes from Engineering-Notes@${notes_sha}"
          git push
